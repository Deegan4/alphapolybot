[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Security headers for all responses
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' wss://ws-subscriptions-clob.polymarket.com wss://ws-live-data.polymarket.com wss://stream.binance.com:9443 wss://api.hyperliquid.xyz https://api.telegram.org https://discord.com; img-src 'self' data:; frame-ancestors 'none';"

# SPA redirect — all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# API proxy: CLOB (Polymarket international order book + trading)
[[redirects]]
  from = "/api/clob/*"
  to = "https://clob.polymarket.com/:splat"
  status = 200
  force = true

# API proxy: Gamma (Polymarket market data)
[[redirects]]
  from = "/api/gamma/*"
  to = "https://gamma-api.polymarket.com/:splat"
  status = 200
  force = true

# API proxy: Polygon RPC (primary)
[[redirects]]
  from = "/api/polygon-rpc"
  to = "https://polygon-bor-rpc.publicnode.com/"
  status = 200
  force = true

# API proxy: Polygon RPC (fallback)
[[redirects]]
  from = "/api/polygon-rpc2"
  to = "https://1rpc.io/matic"
  status = 200
  force = true

# API proxy: PolyBacktest (historical BTC Up/Down market data for backtesting)
[[redirects]]
  from = "/api/polybacktest/*"
  to = "https://api.polybacktest.com/:splat"
  status = 200
  force = true

[build.environment]
  NODE_VERSION = "20"
