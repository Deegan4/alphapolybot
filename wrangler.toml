# Cloudflare Pages — AlphaPolyBot
# Deploy: npm run build && npm run deploy:cf
#
# Requires CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in the environment.
# Create a token at https://dash.cloudflare.com/profile/api-tokens
# with "Cloudflare Pages — Edit" permissions.

name = "alphapolybot"
compatibility_date = "2024-11-01"
pages_build_output_dir = "dist"

[vars]
# No server-side secrets — the SPA keeps credentials in the browser.
NODE_VERSION = "20"
