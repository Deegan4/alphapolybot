name: Daily backtest

# Replays the Crypto Up/Down signal on the last 24 hours of finished windows
# using only free public data (Polymarket US + Binance.US). No credentials, no
# orders. The report appears in the run's summary and as a downloadable file,
# so there is a daily record of whether the signal would have made money.
# A failure here means the public APIs changed or rate-limited this runner,
# not that a commit is broken.
on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      assets:
        description: 'Coins, comma separated'
        default: 'BTC,ETH,SOL'
      hours:
        description: 'Hours of history'
        default: '24'

permissions:
  contents: read

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run backtest
        env:
          ASSETS: ${{ inputs.assets || 'BTC,ETH,SOL' }}
          HOURS: ${{ inputs.hours || '24' }}
        run: |
          npm run -s backtest -- --asset "$ASSETS" --hours "$HOURS" --out backtest.json | tee backtest.txt
          {
            echo '```'
            cat backtest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            backtest.txt
            backtest.json
          retention-days: 90
